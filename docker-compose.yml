services:
  mysql:
    image: mysql:8.4
    container_name: gstech-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestion_stagiaires}
      MYSQL_USER: ${MYSQL_USER:-gstech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001_object_storage.sql:/docker-entrypoint-initdb.d/02-object-storage.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - gstech

  object-storage:
    image: quay.io/minio/minio:latest
    container_name: gstech-object-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}

    volumes:
      - object-storage-data:/data

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - gstech

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: gstech-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      object-storage:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-gstech}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: ${MYSQL_DATABASE:-gestion_stagiaires}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}

      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}

      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://object-storage:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-gstech}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FALLBACK_LOCAL: ${STORAGE_FALLBACK_LOCAL:-true}

      ABSENCE_ALERT_THRESHOLD: ${ABSENCE_ALERT_THRESHOLD:-3}

      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-bootstrap@gstech.ma}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:?BOOTSTRAP_SUPERADMIN_PASSWORD is required}
      BOOTSTRAP_SUPERADMIN_ACCESS_LEVEL: ${BOOTSTRAP_SUPERADMIN_ACCESS_LEVEL:-technical}

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      - uploads_data:/app/uploads

    networks:
      - gstech

networks:
  gstech:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  object-storage-data: